<body>
  <header>
    <div class="header">
      <h1 class="logo">MyProfile</h1>
      <nav class="menu">
        <ul>
          <li><a href="index.html#about">ABOUT</a></li>
          <li><a href="index.html#works">WORKS</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <article>
      <section id="main-visual">
        <div>
         <img src="images/main.png" alt="カメラの写真"> 
        </div>
      </section>
      <section id="about">
        <h1>About</h1>
        <div class="about-flex">
          <div>
            <img src="images/about.png" alt="Kazuki Asahina">
          </div>
          <div>
            <h2>Kazuki Asahina</h2>
            <ul>
              <li>25歳 長野県佐久市出身</li>
              <li>ソフトウェア業界でマーケティングに従事</li>
              <li>趣味はカメラ、愛機はCanon</li>
              <li>自然を撮影するのが好きで、海や山によく行く</li>
            </ul>
          </div>
        </div>
      </section>
      <section id="works">
        <h1>Works</h1>
        <div class="works-details">
          <div class="works1">
            <img src="images/works1.png" alt="新潟で撮影した日本海">
            <p>新潟に訪れた際に、日本海の雄大さに魅了<br class="works_br">されて撮影した1枚</p>
          </div>
          <div class="works2">
            <img src="images/works2.png" alt="長野木曽町から撮影した御嶽山">
            <p>地元長野の木曽町から撮影した、冠雪した<br class="works_br">御嶽山</p>
          </div>
          <div class="works3">
            <img src="images/works3.png" alt="京都の町並み">
            <p>京都で撮影した、明け方の古き良き日本の<br class="works_br">町並み</p>
          </div>
        </div>
      </section>
    </article>
  </main>
